[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-system"
version = "0.1.0"
description = "Система банківських рахунків для лабораторної роботи"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: mark test as integration test",
]

[tool.coverage.run]
source = ["bank_system"]
omit = [
    "src/bank_system/data.py",
    "src/bank_system/decorators.py",
    "src/bank_system/streaming.py",
    "src/bank_system/processors.py",
    "src/bank_system/analytics.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == '__main__':",
    "raise NotImplementedError",
]
fail_under = 50

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "bank_system.data"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bank_system.decorators"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bank_system.streaming"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bank_system.processors"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bank_system.analytics"
ignore_errors = true
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true